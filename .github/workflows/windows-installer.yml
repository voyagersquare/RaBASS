name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-package:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build x64 VST3 and run tests
        shell: powershell
        run: |
          & .\Build-Windows.cmd --no-pause
          if ($LASTEXITCODE -ne 0) { throw 'Build or tests failed.' }
      - name: Capture instrument editor
        shell: powershell
        run: |
          & .\build\windows-x64\RaBASSProcessorTests.exe RaBASS-editor.png
          if ($LASTEXITCODE -ne 0) { throw 'Editor validation failed.' }
      - name: Install pinned Inno Setup compiler
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') { throw 'Inno Setup checksum mismatch.' }
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Package verified VST3 bundle
        shell: powershell
        run: .\Installer\Build-Installer.ps1 -SkipBuild
      - name: Verify install, upgrade and uninstall
        shell: powershell
        run: |
          $installers = @(Get-ChildItem .\build\installer\RaBASS-*-Windows-x64-Setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one setup executable.' }
          & .\Installer\Smoke-Test-Installer.ps1 -Installer $installers[0].FullName
      - name: Include corresponding source
        shell: powershell
        run: |
          git archive --format=zip --output=build/installer/RaBASS-Source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'RaBASS source archive failed.' }
          git -C build/windows-x64/_deps/juce-src archive --format=zip --output=../../../installer/JUCE-8.0.6-Source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'JUCE source archive failed.' }
      - name: Upload tested installer, VST3 and source
        uses: actions/upload-artifact@v4
        with:
          name: RaBASS-Windows-x64
          path: |
            build/installer/*
            build/windows-x64/RaBASS_artefacts/Release/VST3/RaBASS.vst3
            RaBASS-editor.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RaBASS-build-diagnostics
          path: |
            build/windows-x64/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/RaBASS-install-*.log
          if-no-files-found: ignore

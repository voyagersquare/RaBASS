name: Windows VST3 installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Source/**'
      - 'Tests/**'
      - 'ThirdParty/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'Build-Windows.cmd'
      - 'Package-VST3.ps1'
      - 'Build-Installer.cmd'
      - 'Installer/**'
      - '.github/workflows/windows-vst3.yml'
  pull_request:
permissions:
  contents: read
concurrency:
  group: windows-vst3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-package:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Windows installer scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem .\Installer\*.ps1, .\Package-VST3.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          }
      - name: Build x64 VST3 and run tests
        shell: powershell
        run: |
          & .\Build-Windows.cmd --no-pause
          if ($LASTEXITCODE -ne 0) { throw 'Build or tests failed.' }
      - name: Capture instrument editor
        shell: powershell
        run: |
          & .\build\windows-x64\RaBASSProcessorTests.exe RaBASS-editor.png
          if ($LASTEXITCODE -ne 0) { throw 'Editor validation failed.' }
      - name: Install pinned Inno Setup compiler
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') { throw 'Inno Setup checksum mismatch.' }
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build installer and test install, upgrade and uninstall
        shell: powershell
        run: .\Installer\Build-Installer.ps1 -SkipBuild -SmokeTest
      - name: Upload tested VST3 installer and source
        uses: actions/upload-artifact@v4
        with:
          name: RaBASS-Windows-x64-Installer
          path: |
            build/packages/*
            RaBASS-editor.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RaBASS-test-diagnostics
          path: |
            build/windows-x64/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/RaBASS-install-*.log
          if-no-files-found: ignore
  publish:
    needs: build-test-package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RaBASS-Windows-x64-Installer
          path: artifacts
      - name: Verify packages and source provenance
        id: package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, struct, zipfile
          root=Path('artifacts/build/packages')
          info=json.loads((root/'release-info.json').read_text(encoding='utf-8-sig'))
          version=info['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',version)
          assert info['sourceCommit']==os.environ['GITHUB_SHA']
          for line in (root/'SHA256SUMS.txt').read_text().splitlines():
              expected,name=line.split('  ',1)
              assert Path(name).name==name
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected
          with zipfile.ZipFile(root/'RaBASS-Source.zip') as z:
              assert z.comment.decode()==os.environ['GITHUB_SHA']
          assert info['format']=='VST3' and info['standalone'] is False
          data=(root/f'RaBASS-{version}-Windows-x64-Setup.exe').read_bytes()
          pe=struct.unpack_from('<I',data,0x3c)[0]
          assert data[:2]==b'MZ' and data[pe:pe+4]==b'PE\0\0'
          report=json.loads((root/'installer-test-results.json').read_text(encoding='utf-8-sig'))
          assert report['version']==version and report['format']=='VST3'
          assert all(report['checks'][name] is True for name in ('freshInstall','installedBundleChecksums','reinstall','portableUpgrade','installedAppsRegistration','vst3Only','uninstall','userPresetsPreserved'))
          expected={f'RaBASS-{version}-Windows-x64-Setup.exe','RaBASS-Source.zip','JUCE-8.0.6-Source.zip','installer-test-results.json'}
          assert set(info['files'])==expected
          assert {p.name for p in root.iterdir()}==expected|{'release-info.json','SHA256SUMS.txt'}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('version='+version+'\n')
          PY
      - name: Publish VST3 release
        env:
          RABASS_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RABASS_VERSION-installer-preview.1"
          cat > notes.md <<EOF
          RaBASS $RABASS_VERSION — Windows VST3 Installer Preview.

          Standard Windows Setup.exe wizard for the VST3 bass instrument. The complete x64 VST3 bundle installs to C:\Program Files\Common Files\VST3\RaBASS.vst3. Remove it through Windows Settings > Apps > Installed apps > RaBASS.

          VST3 instrument only: no standalone application, desktop shortcut or Start menu app. The RaBass script logo, floppy-disk Save Preset button, dark red chrome controls, fine cutoff adjustment and all 18 factory presets are included.

          Presets in AppData/Roaming/Independent Audio/RaBASS/Presets are preserved during installation and uninstall. The original RaBASS installer identity is retained for upgrades.

          Preuzmite RaBASS-$RABASS_VERSION-Windows-x64-Setup.exe, zatvorite Ableton Live i pokrenite instaler. U Liveu uključite VST3 system folders, kliknite Rescan i dodajte RaBASS na MIDI traku. Na odredišnom računalu nisu potrebni Visual Studio ni dodatni runtime download.

          Windows checks cover fresh installation, installed bundle checksums, reinstallation, replacing an existing portable VST3, Installed apps registration, absence of standalone binaries, uninstall and user preset preservation. See installer-test-results.json and https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID

          Corresponding RaBASS and JUCE source archives, licences and SHA256 checks accompany the installer. Original RaBASS code: CC0-1.0. The combined JUCE plugin uses JUCE's AGPLv3 option. Final host-specific testing in Ableton Live 12 takes place on the user's Windows computer.
          EOF
          if gh release view "$tag" --json isDraft > existing.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          assert json.load(open('existing.json'))['isDraft'], 'This version is already published; bump the project version for a new release.'
          PY
          else
            gh release create "$tag" --draft --prerelease --latest=false --target "$GITHUB_SHA" --title "RaBASS $RABASS_VERSION — Windows VST3 Installer" --notes-file notes.md
          fi
          gh release upload "$tag" artifacts/build/packages/* artifacts/RaBASS-editor.png --clobber
          gh release edit "$tag" --draft=false --prerelease --notes-file notes.md --latest=false
